<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buildings - Medieval Empire</title>
    <link rel="stylesheet" href="./css/layout.css" />

</head>

<body>
    <!-- Töltőképernyő -->
    <div id="loading-screen">
        <p><strong>Loading buildings...</strong></p>
        <div class="progress-bar">
            <div id="progress-bar-inner" class="progress-bar-inner"></div>
        </div>
    </div>

    <!-- Toast container minden oldal tetején -->
    <div id="toast-container"></div>

    <div id="game-container">
        <header>
            <h1>
                Buildings - 
                    <a href="https://github.com/MassiveAwareness/medieval-empire" target="_blank" rel="noopener noreferrer">
                        Medieval Empire
                    </a>
            </h1>
            <p class="version-subtitle">version Alpha v1.2.0</p>
        </header>

        <nav>
            <a href="./index.html">Dashboard</a>
            <a href="./buildings.html" class="active">Buildings</a>
            <a href="./keep.html">The Keep</a>
        </nav>

        <div id="resources-panel" class="panel">
            <h2>Resources</h2>
            <p>Wood: <span id="wood">0</span> / <span id="wood-cap">0</span></p>
            <p>Stone: <span id="stone">0</span> / <span id="stone-cap">0</span></p>
            <p>Food: <span id="food">0</span> / <span id="food-cap">0</span></p>
        </div>

        <main>
            <div id="buildings-panel" class="panel">
                <h2>Manage Buildings</h2>
                <div id="building-list">
                    <!-- Az épületek ide kerülnek -->
                </div>
            </div>

            <div id="actions-panel" class="panel">
                <h2>Actions</h2>
                <button id="save-button">Save Game</button>
                <button id="reset-button">Reset Game</button>
            </div>
        </main>

        <footer>&COPY; MassiveAwareness, 2025. All rights reserved!</footer>
    </div>

    <script type="module" src="./js/gameloop.js"></script>
</body>
</html>
