<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medieval Empire</title>
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="icon" type="ico/image" href="./assets/favicon.ico" />

</head>

<body>
    <div id="loading-screen">
        <p><strong>Loading Medieval Empire...</strong></p>
        <div class="progress-bar">
            <div id="progress-bar-inner" class="progress-bar-inner"></div>
        </div>
    </div>
    
    <div id="game-container">
        <header>
            <h1>
                <a href="https://github.com/MassiveAwareness/medieval-empire" target="_blank">
                    Medieval Empire
                </a>
            </h1>

            <p class="version-subtitle">version Alpha v1.1.2</p>
        </header>

        <!-- Nyersanyagok kijelzője -->
        <div id="resources-panel" class="panel">
            <h2>Resources</h2>
            <p><strong>Wood: <span id="wood">0</span> / <span id="wood-cap">0</span></strong></p>
            <p><strong>Stone: <span id="stone">0</span> / <span id="stone-cap">0</span></strong></p>
            <p><strong>Food: <span id="food">0</span> / <span id="food-cap">0</span></strong></p>
            <p><strong>Gold: <span id="gold">0</span></strong></p>
            <p><strong>Sapphire: <span id="sapphire">0</strong></p>
        </div>

        <!-- Épületek és akciók -->
        <div id="buildings-panel" class="panel">
            <h2>Buildings</h2>
            <!-- MÓDOSÍTVA: A régi, fix épület div-ek törölve lettek -->
            <!-- Ide fogja a JavaScript dinamikusan generálni az épületeket -->
            <div id="building-list"></div>
        </div>

        <div id="actions-panel" class="panel">
            <h2>Actions</h2>
            <button id="save-button">Save Game</button>
            <button id="reset-button">Reset Game</button>
        </div>

        <div id="message-panel" class="panel">
            <p id="message-text">Welcome to your empire! Start building your own kingdom!</p>
        </div>

        <footer>&COPY; MassiveAwareness, 2025. All rights reserved!</footer>
    </div>

    <script type="module" src="./js/gameloop.js"></script>
</body>
</html>
